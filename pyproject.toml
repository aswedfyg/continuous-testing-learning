[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q" 
markers = [
    "smoke: core tests that verify the app is basically working",
    "regression: broader tests for existing behavior",
    "api: API tests",
    "ui: browser UI tests",
]




[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

