name: CI

on:
  push:
  pull_request:
  schedule: 
    - cron: "0 18 * * *"  # Run every day at 18:00 UTC,北京时间每天凌晨2点
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Start test app
        run: | # Start the app in the background and redirect output to a log file
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for test app
        run: |
          for i in {1..30}; do  # Wait up to 30 seconds for the app to start
            if curl -f http://127.0.0.1:8000/health; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 1
          done
          echo "App did not start in time"
          cat uvicorn.log
          exit 1

      - name: Lint
        run: ruff check .

      - name: Run smoke tests
        run: pytest -m smoke --html=reports/smoke.html --self-contained-html
        env:
          BASE_URL: http://127.0.0.1:8000  # Set the base URL for smoke tests

     
      - name: Run API regression tests
        run: pytest -m "api and regression" --html=reports/api-regression.html --self-contained-html

      - name: Run UI regression tests
        run: pytest -m "ui and regression" --html=reports/ui-regression.html --self-contained-html
        env:
          BASE_URL: http://127.0.0.1:8000
     
     
     
      - name: Run API tests
        run: pytest tests/api --html=reports/api.html --self-contained-html

      - name: Run UI tests
        run: pytest tests/ui --html=reports/ui.html --self-contained-html
        env:
          BASE_URL: http://127.0.0.1:8000



      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: reports/

